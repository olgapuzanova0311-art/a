<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ИИ-офис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--blue:#1009F6;--blue-d:#0B06B8;--yellow:#FFBA09;--ink:#141414;--ink2:#55555C;--cream:#F3F3EF;--line:#DADAD3;--white:#fff;--sky:#DCE8F7;--font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;height:100dvh}
header{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 16px;background:var(--white);border-bottom:1.5px solid var(--ink)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:var(--yellow);font-style:normal;font-size:16px}
.brain{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--cream);white-space:nowrap}
.brain.on{background:#DDF6E8;color:#11653A}.brain.off{background:#FFE9C7;color:#8A5A00}
.sp{flex:1}
.stats{font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}.stats .g{color:#2BB673}
.btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ink);background:var(--white);font-weight:700;font-size:14px;white-space:nowrap}
.btn.y{background:var(--yellow)}.btn.b{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;overflow:hidden}
.stage{min-width:0;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;padding:16px;gap:12px}
.room{position:relative;border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:#2b2d42;min-height:240px;box-shadow:6px 6px 0 var(--yellow)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
@media (max-width:600px){.hint{display:none}}
.hint{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700}
.team{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.card{flex:none;display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;border-radius:16px;border:1.5px solid var(--ink);background:var(--white);cursor:pointer;min-width:190px}
.card.sel{background:var(--yellow)}
.card.new{animation:hired 1s ease-in-out 6}
@keyframes hired{50%{box-shadow:0 0 0 4px var(--yellow)}}
@media (prefers-reduced-motion:reduce){.card.new{animation:none;box-shadow:0 0 0 3px var(--yellow)}}
.av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;border:1.5px solid var(--ink)}
.card b{display:block;font-size:14px;line-height:1.2}.card small{font-size:12px;color:var(--ink2)}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;background:#B8B8C0;margin-right:5px;vertical-align:1px}
.st.working{background:#2BB673;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
aside{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;border-left:1.5px solid var(--ink);background:var(--white);min-height:0;overflow:hidden}
.ah{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1.5px solid var(--line)}
.ah .av{width:44px;height:44px;font-size:18px}
.ah>div{min-width:0}
.ah h2{margin:0;font-size:17px;line-height:1.2}.ah p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.tabs{display:flex;gap:6px;padding:10px 16px;border-bottom:1.5px solid var(--line)}
.tab{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.msgs{min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--cream)}
.m{max-width:88%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;border:1.5px solid var(--ink)}
.m.user{align-self:flex-end;background:var(--yellow);border-bottom-right-radius:4px}
.m.agent{align-self:flex-start;background:var(--white);border-bottom-left-radius:4px}
.m.system{align-self:stretch;max-width:100%;background:var(--sky);border-style:dashed;font-size:13px}
.m .au{display:block;font-size:11.5px;font-weight:800;color:var(--blue);margin-bottom:3px}
.typing{align-self:flex-start;font-size:13px;color:var(--ink2);font-weight:600}
.empty{color:var(--ink2);font-size:14px;text-align:center;margin:auto;max-width:28ch}
.composer{padding:12px 16px;border-top:1.5px solid var(--line);display:grid;gap:8px}
textarea,input,select{width:100%;font:15px var(--font);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--cream);color:var(--ink);resize:none}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue);background:#fff}
.row{display:flex;gap:8px}.row .btn{flex:1;justify-content:center}
.form{overflow-y:auto;padding:16px;display:grid;gap:12px;align-content:start}
.form label{display:grid;gap:6px;font-size:13px;font-weight:700}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--ink)}
.colors button.on{outline:3px solid var(--ink);outline-offset:2px}
.tpls{display:flex;gap:6px;flex-wrap:wrap}
.tpls button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:700}
.task{border:1.5px solid var(--ink);border-radius:14px;background:#fff;padding:10px 12px;font-size:13.5px}
.task summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:flex-start}
.task .s{flex:none;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--cream)}
.task .s.done{background:#DDF6E8;color:#11653A}.task .s.working,.task .s.queued{background:#FFE9C7;color:#8A5A00}.task .s.error{background:#FDE2E2;color:#9B1C1C}
.task pre{white-space:pre-wrap;font:13px/1.45 var(--font);margin:8px 0 0;background:var(--cream);border-radius:10px;padding:8px}
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:#fff;border:2px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--yellow);width:min(440px,100%);padding:24px;display:grid;gap:14px}
.modal h3{margin:0;font-size:22px}
.err{color:#B42318;font-size:13px;font-weight:600;min-height:1em}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .app{height:auto;min-height:100dvh}
  .room{height:58vw;min-height:220px}
  aside{border-left:0;border-top:1.5px solid var(--ink);height:78dvh}
  header .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i>◆</i><span>ИИ-офис</span></div>
    <span class="brain" id="brain">…</span>
    <span class="stats hide-m" id="stats"></span>
    <span class="sp"></span>
    <button class="btn sm hide-m" id="btnTasks">📋 Задачи</button>
    <button class="btn y sm" id="btnHire">+ Нанять агента</button>
  </header>
  <div class="main">
    <section class="stage">
      <div class="room"><canvas id="cv"></canvas><span class="hint">Нажми на робота, чтобы поговорить</span></div>
      <div class="team" id="team"></div>
    </section>
    <aside>
      <div class="ah" id="ah"></div>
      <div class="tabs"><button class="tab on" data-tab="chat">Чат</button><button class="tab" data-tab="tasks">Задачи</button><button class="tab" data-tab="edit">Настройки</button></div>
      <div class="msgs" id="pane"></div>
      <div class="composer" id="composer">
        <textarea id="inp" rows="3" placeholder="Напиши сообщение или задачу…"></textarea>
        <div class="row"><button class="btn b" id="send">Написать</button><button class="btn y" id="task">Дать задачу</button></div>
      </div>
    </aside>
  </div>
</div>

<div class="overlay" id="login" hidden>
  <form class="modal" id="loginForm">
    <h3>Вход в ИИ-офис</h3>
    <input type="password" id="pwd" placeholder="Пароль" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn y" type="submit" style="justify-content:center">Войти</button>
  </form>
</div>

<div class="overlay" id="hire" hidden>
  <div class="modal" style="width:min(560px,100%);max-height:92dvh;overflow:auto">
    <h3 id="hireTitle">Нанять агента</h3>
    <div><div style="font-size:13px;font-weight:700;margin-bottom:6px">Готовые роли</div><div class="tpls" id="tpls"></div></div>
    <div class="form" style="padding:0">
      <label>Имя<input id="fName" maxlength="40" placeholder="Например: Аналитик продаж"></label>
      <label>Чем занимается<input id="fRole" maxlength="120" placeholder="Коротко, одной строкой"></label>
      <label>Отдел<select id="fDept"></select></label>
      <label>Инструкция: роль, материалы, правила, результат<textarea id="fPrompt" rows="7" placeholder="Ты … Материалы: … Правила: … Результат: …"></textarea></label>
      <label>Цвет робота<div class="colors" id="fColors"></div></label>
      <label>Модель (необязательно)<input id="fModel" placeholder="по умолчанию из настроек офиса"></label>
    </div>
    <div class="err" id="hireErr"></div>
    <div class="row"><button class="btn" id="hireCancel">Отмена</button><button class="btn y" id="hireSave">Нанять</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var COLORS = ['#1009F6','#FFBA09','#2BB673','#FF7A45','#8E5CF7','#E8467C','#14A3C7','#0B06B8','#3DBE8B','#6B7280'];
var S = { agents: [], tasks: [], last: 0, sel: null, tab: 'chat', msgsKey: '', editId: null, color: COLORS[0], waiting: {} };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function api(path, body, method){
  return fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined, credentials: 'same-origin' })
    .then(function(r){ if (r.status === 401) { $('login').hidden = false; throw new Error('auth'); } return r.json(); });
}
function agent(id){ for (var i = 0; i < S.agents.length; i++) if (S.agents[i].id === id) return S.agents[i]; return null; }
function initials(n){ return (n || '?').trim().charAt(0).toUpperCase(); }

/* ================= пиксельный офис ================= */
var W = 512, H = 320, cv = $('cv'), ctx = cv.getContext('2d');
var off = document.createElement('canvas'); off.width = W; off.height = H; var px = off.getContext('2d');
var robots = {}, bubbles = [], tick = 0;
// отделы: комнаты 3×3, последняя клетка — лаунж (кофе, диван, места для новеньких без отдела)
var DEPT_ORDER = ['lead','marketing','studio','sales','analytics','edu','tech','reception'];
var DEPT_ICON = {lead:'👑', marketing:'📣', studio:'🎬', sales:'💰', analytics:'📊', edu:'🎓', tech:'⚙️', reception:'📅', lounge:'☕'};
var DEPT_TINT = {lead:'#EFE6FF', marketing:'#FFE6EE', studio:'#E6F4FF', sales:'#E3F7EC', analytics:'#E8EAF6', edu:'#FFF4D6', tech:'#E6F0FF', reception:'#F1EEE5', lounge:'#DCE8F7'};
var ZONES = [];
(function(){
  var keys = DEPT_ORDER.concat(['lounge']);
  keys.forEach(function(k, i){
    var c = i % 3, r = (i / 3) | 0, z = {key: k, x: 6 + c * 170, y: 34 + r * 96, w: 164, h: 90, desks: []};
    var n = k === 'lounge' ? 2 : 4;
    for (var j = 0; j < n; j++) z.desks.push({x: z.x + 24 + j * 38, y: z.y + 48, boss: k === 'lead' && j === 0, zone: k});
    ZONES.push(z);
  });
})();
var ZL = ZONES[8], COFFEE = {x: ZL.x + 150, y: ZL.y + 40};
var LOUNGE = [{x: ZL.x + 100, y: ZL.y + 70}, {x: ZL.x + 120, y: ZL.y + 78}, {x: ZL.x + 140, y: ZL.y + 70}, {x: ZL.x + 110, y: ZL.y + 56}];
var ENTRY = {x: ZONES[7].x + 82, y: H - 6};
function zone(k){ for (var i = 0; i < ZONES.length; i++) if (ZONES[i].key === k) return ZONES[i]; return ZL; }
function deptOf(a){ return a.is_main ? 'lead' : (DEPT_ORDER.indexOf(a.dept) >= 0 ? a.dept : 'lounge'); }
// рассадка: по порядку внутри отдела; кому не хватило стола в своей комнате, садится в лаунж
var SEATING = {key: '', map: {}, used: []};
function seating(){
  var key = S.agents.map(function(a){ return a.id + ':' + a.dept + ':' + a.is_main; }).join(',');
  if (key === SEATING.key) return SEATING;
  var map = {}, used = [], free = {}, spare = ZL.desks.slice();
  ZONES.forEach(function(z){ free[z.key] = z.desks.slice(); });
  var list = S.agents.slice().sort(function(a, b){ return (b.is_main - a.is_main) || (a.id - b.id); });
  list.forEach(function(a){
    var d = (free[deptOf(a)] || []).shift() || spare.shift();
    if (!d) d = ZL.desks[a.id % ZL.desks.length];
    if (free.lounge.indexOf(d) >= 0) free.lounge.splice(free.lounge.indexOf(d), 1);
    if (spare.indexOf(d) >= 0) spare.splice(spare.indexOf(d), 1);
    map[a.id] = d; used.push([d, a]);
  });
  SEATING = {key: key, map: map, used: used};
  return SEATING;
}

function rect(x,y,w,h,c){ px.fillStyle = c; px.fillRect(x|0, y|0, w, h); }
function shade(hex, k){
  var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  function f(v){ return Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k))); }
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function plant(x, y){ rect(x, y + 8, 8, 8, '#B5651D'); rect(x - 2, y, 12, 9, '#2BB673'); rect(x + 1, y - 3, 6, 4, '#3DBE8B'); }
function drawRoom(){
  rect(0, 0, W, H, '#2B2D42');
  // окна с вечерним городом
  rect(0, 0, W, 30, '#1C2541');
  for (var i = 0; i < 12; i++) { var bx = 8 + i * 42, bh = 10 + (i * 7) % 14; rect(bx, 28 - bh, 26, bh, '#3A3F63'); for (var wy = 30 - bh; wy < 26; wy += 4) for (var wx = bx + 3; wx < bx + 24; wx += 5) if ((wx * 7 + wy * 3 + i) % 5 < 3) rect(wx, wy, 2, 2, '#FFD36B'); }
  rect(0, 29, W, 3, '#141414');
  ZONES.forEach(function(z){
    var t = DEPT_TINT[z.key];
    for (var y = z.y; y < z.y + z.h; y += 8) for (var x = z.x; x < z.x + z.w; x += 8) rect(x, y, 8, 8, ((x + y) / 8) % 2 ? t : shade(t, -.035));
    rect(z.x - 2, z.y - 2, z.w + 4, 2, '#141414'); rect(z.x - 2, z.y + z.h, z.w + 4, 2, '#141414');
    rect(z.x - 2, z.y - 2, 2, z.h + 4, '#141414'); rect(z.x + z.w, z.y - 2, 2, z.h + 4, '#141414');
    rect(z.x + z.w / 2 - 10, z.y + z.h, 20, 2, t);  // дверь в коридор
    plant(z.x + z.w - 12, z.y + z.h - 18);
  });
  // лаунж: диван, кофемашина, столик
  rect(ZL.x + 92, ZL.y + 70, 56, 12, '#FF7A45'); rect(ZL.x + 92, ZL.y + 66, 56, 6, '#E2602F'); rect(ZL.x + 90, ZL.y + 68, 4, 14, '#C94F22'); rect(ZL.x + 146, ZL.y + 68, 4, 14, '#C94F22');
  rect(ZL.x + 108, ZL.y + 50, 22, 8, '#B98B5E');
  rect(COFFEE.x - 6, COFFEE.y - 18, 14, 22, '#5B5F73'); rect(COFFEE.x - 4, COFFEE.y - 14, 10, 6, '#2B2D42'); rect(COFFEE.x - 2, COFFEE.y - 4, 4, 3, '#FFFFFF');
  // штаб: доска с графиком
  var ZH = ZONES[0]; rect(ZH.x + 100, ZH.y + 20, 52, 18, '#141414'); rect(ZH.x + 102, ZH.y + 22, 48, 14, '#1009F6');
  [4, 7, 5, 9, 12].forEach(function(v, i){ rect(ZH.x + 106 + i * 9, ZH.y + 34 - v, 5, v, '#FFBA09'); });
}
function drawDesk(d, a){
  var w = d.boss ? 40 : 32;
  rect(d.x - w/2, d.y - 6, w, 11, '#B98B5E'); rect(d.x - w/2, d.y - 6, w, 2, '#D4AA80'); rect(d.x - w/2 + 2, d.y + 5, 3, 7, '#8C6440'); rect(d.x + w/2 - 5, d.y + 5, 3, 7, '#8C6440');
  rect(d.x - 8, d.y - 18, 16, 11, '#141414');
  var on = a && a.status === 'working';
  rect(d.x - 7, d.y - 17, 14, 9, on ? (tick % 20 < 10 ? shade(a.color, .55) : shade(a.color, .35)) : (a ? '#3A3D55' : '#2A2C3E'));
  if (on) for (var i = 0; i < 3; i++) rect(d.x - 5 + i * 4, d.y - 14 + ((tick / 6 + i) % 3 | 0), 2, 1, '#FFFFFF');
  rect(d.x - 2, d.y - 7, 4, 2, '#141414');
  if (d.boss) { rect(d.x + 10, d.y - 10, 6, 5, '#FFBA09'); rect(d.x + 12, d.y - 12, 2, 2, '#FFFFFF'); }
}
function drawRobot(r){
  var a = agent(r.id); if (!a) return;
  var x = Math.round(r.x), y = Math.round(r.y), c = a.color, step = r.moving ? ((tick / 5 | 0) % 2) : 0;
  rect(x - 5, y + 1, 10, 2, 'rgba(0,0,0,.18)');
  rect(x - 3, y - 3, 2, 3 - step, '#2B2D42'); rect(x + 1, y - 3, 2, 2 + step, '#2B2D42');
  rect(x - 5, y - 9, 10, 7, c); rect(x - 5, y - 9, 10, 1, shade(c, .3)); rect(x - 2, y - 7, 4, 3, shade(c, .5));
  rect(x - 6, y - 8, 1, 4, shade(c, -.25)); rect(x + 5, y - 8, 1, 4, shade(c, -.25));
  rect(x - 5, y - 16, 10, 7, '#E8ECF7'); rect(x - 5, y - 16, 10, 1, '#FFFFFF'); rect(x - 4, y - 14, 8, 3, '#1C1E2E');
  var blink = (tick + r.id * 17) % 140 < 4;
  if (!blink) { rect(x - 3, y - 13, 2, 1, '#5CF2FF'); rect(x + 1, y - 13, 2, 1, '#5CF2FF'); }
  rect(x, y - 19, 1, 3, '#2B2D42'); rect(x - 1, y - 21, 3, 2, a.status === 'working' ? (tick % 16 < 8 ? '#FFBA09' : '#FF7A45') : c);
  if (a.is_main) { rect(x - 3, y - 18, 1, 2, '#FFBA09'); rect(x + 3, y - 18, 1, 2, '#FFBA09'); rect(x - 3, y - 18, 7, 1, '#FFBA09'); }
  if (S.sel === r.id) { rect(x - 7, y + 3, 14, 1, '#FFBA09'); }
}

function deskOf(a){ return seating().map[a.id] || ZL.desks[0]; }
function seat(a){ var d = deskOf(a); return {x: d.x, y: d.y + 18}; }
function syncRobots(){
  var seen = {};
  S.agents.forEach(function(a){
    seen[a.id] = 1;
    if (!robots[a.id]) { var s = seat(a); robots[a.id] = {id: a.id, x: s.x, y: s.y, tx: s.x, ty: s.y, moving: false, wait: 60 + Math.random() * 200, plan: null}; }
  });
  Object.keys(robots).forEach(function(k){ if (!seen[k]) delete robots[k]; });
}
function goTo(r, x, y, then){ r.tx = x; r.ty = y; r.plan = then || null; }
function think(r){
  var a = agent(r.id); if (!a) return;
  if (r.busyUntil && r.busyUntil > tick) return;
  if (a.status === 'working') { var s = seat(a); goTo(r, s.x, s.y); return; }
  if (r.moving) return;
  if ((r.wait -= 1) > 0) return;
  r.wait = 300 + Math.random() * 500;
  // в основном сидят у себя в отделе, иногда ходят за кофе или в лаунж
  var roll = Math.random();
  if (roll < .8) { var s2 = seat(a); goTo(r, s2.x + (Math.random() * 8 - 4), s2.y); }
  else if (roll < .9) goTo(r, COFFEE.x - 14, COFFEE.y + 10, function(){ say(r.id, '☕'); });
  else { var p = LOUNGE[(Math.random() * LOUNGE.length) | 0]; goTo(r, p.x + (Math.random() * 16 - 8), p.y); }
}
function move(r){
  var dx = r.tx - r.x, dy = r.ty - r.y, d = Math.sqrt(dx * dx + dy * dy), sp = .9;
  if (d < 1) { r.x = r.tx; r.y = r.ty; if (r.moving && r.plan) { var p = r.plan; r.plan = null; p(); } r.moving = false; return; }
  r.moving = true; r.x += dx / d * Math.min(sp, d); r.y += dy / d * Math.min(sp, d);
}
function say(id, text, ttl){ bubbles = bubbles.filter(function(b){ return b.id !== id; }); bubbles.push({id: id, text: text, until: tick + (ttl || 150)}); }
function talk(aId, bId, text){
  // поручения встают в очередь: робот обходит всех адресатов по порядку и возвращается на место
  var ra = robots[aId]; if (!ra || !robots[bId]) return;
  ra.queue = ra.queue || [];
  ra.queue.push({to: bId, text: text});
  if (!ra.walking) nextVisit(ra);
}
function nextVisit(ra){
  var a = agent(ra.id), v = ra.queue && ra.queue.shift();
  if (!v) {
    ra.walking = false;
    if (a) { var s = seat(a); goTo(ra, s.x, s.y); }
    ra.busyUntil = tick + 60;
    return;
  }
  var rb = robots[v.to]; if (!rb) return nextVisit(ra);
  ra.walking = true; ra.busyUntil = tick + 100000;
  say(ra.id, v.text === 'готово' ? '✅ готово' : '📋 несу задачу', 160);
  goTo(ra, rb.x + (rb.x > 200 ? -14 : 14), rb.y, function(){
    var t = v.text || '💬';
    say(ra.id, t === 'готово' ? '✅ Готово, вот отчёт' : t.slice(0, 46) + (t.length > 46 ? '…' : ''), 220);
    setTimeout(function(){ say(v.to, '👍', 120); }, 900);
    var wait = tick + 150;
    ra.plan = null;
    (function hold(){ if (tick < wait) return requestAnimationFrame(hold); nextVisit(ra); })();
  });
}
// найм: новый робот входит в дверь, главный идёт знакомиться, сверху плашка, карточка в команде мигает
var banner = null;
function hired(e){
  var parts = String(e.text || '').split('|'), name = parts[0], role = parts[1] || '';
  var a = agent(e.a), r = robots[e.a];
  banner = {title: '🧑‍💼 Новый сотрудник: ' + name, sub: role, until: tick + 420};
  S.fresh = S.fresh || {}; S.fresh[e.a] = Date.now() + 8000; renderTeam();
  if (!r) return;
  r.x = r.tx = ENTRY.x; r.y = r.ty = ENTRY.y; r.plan = null; r.busyUntil = tick + 100000;
  say(e.a, 'Привет! Я ' + name + ' 👋', 260);
  var boss = e.b || (S.agents.filter(function(x){ return x.is_main; })[0] || {}).id;
  if (boss && boss !== e.a) talk(boss, e.a, '🤝 Добро пожаловать в команду!');
  setTimeout(function(){ r.busyUntil = 0; if (a) { var s = seat(agent(e.a) || a); goTo(r, s.x, s.y); } }, 5200);
}
function onEvent(e){
  if (e.type === 'talk') talk(e.a, e.b, e.text);
  else if (e.type === 'hire') hired(e);
}

function resize(){
  var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
}
function view(){
  var s = Math.min(cv.width / W, cv.height / H), w = W * s, h = H * s;
  return {s: s, ox: (cv.width - w) / 2, oy: (cv.height - h) / 2};
}
function frame(){
  tick++;
  Object.keys(robots).forEach(function(k){ think(robots[k]); move(robots[k]); });
  drawRoom();
  var occ = new Map(); seating().used.forEach(function(p){ occ.set(p[0], p[1]); });
  ZONES.forEach(function(z){ z.desks.forEach(function(d){ drawDesk(d, occ.get(d)); }); });
  Object.keys(robots).map(function(k){ return robots[k]; }).sort(function(a, b){ return a.y - b.y; }).forEach(drawRobot);
  var v = view(), dpr = cv.width / cv.getBoundingClientRect().width || 1;
  ctx.imageSmoothingEnabled = false; ctx.fillStyle = '#2b2d42'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(off, v.ox, v.oy, W * v.s, H * v.s);
  // подписи и облачка в полном разрешении
  drawSigns(v, dpr);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  Object.keys(robots).forEach(function(k){
    var r = robots[k], a = agent(r.id); if (!a) return;
    var X = v.ox + r.x * v.s, Y = v.oy + (r.y + 7) * v.s, fs = Math.max(10, Math.round(3.6 * v.s));
    ctx.font = '700 ' + fs + 'px Onest, sans-serif';
    var nm = a.name.replace(/^AI-/, ''), t = nm.length > 14 ? nm.slice(0, 13) + '…' : nm, tw = ctx.measureText(t).width + 10 * dpr;
    ctx.fillStyle = S.sel === r.id ? '#FFBA09' : 'rgba(255,255,255,.92)'; roundRect(X - tw / 2, Y - fs * .75, tw, fs * 1.5, fs * .6); ctx.fill();
    ctx.fillStyle = '#141414'; ctx.fillText(t, X, Y + 1);
  });
  if (banner && banner.until > tick) {
    var bs = Math.max(13, Math.round(4.4 * v.s)), bw = Math.min(cv.width * .9, Math.max(ctx.measureText(banner.title).width, 10) + 60 * dpr);
    ctx.font = '800 ' + bs + 'px Onest, sans-serif'; bw = Math.min(cv.width * .9, Math.max(ctx.measureText(banner.title).width, banner.sub ? ctx.measureText(banner.sub).width * .8 : 0) + 40 * dpr);
    var bx = cv.width / 2, by = v.oy + bs * 2.2, bh = banner.sub ? bs * 3.1 : bs * 2;
    ctx.fillStyle = '#FFBA09'; ctx.strokeStyle = '#141414'; ctx.lineWidth = 2 * dpr;
    roundRect(bx - bw / 2, by - bs, bw, bh, bs * .6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#141414'; ctx.fillText(banner.title, bx, by, bw - 20 * dpr);
    if (banner.sub) { ctx.font = '600 ' + Math.round(bs * .75) + 'px Onest, sans-serif'; ctx.fillText(banner.sub, bx, by + bs * 1.15, bw - 20 * dpr); }
  }
  bubbles = bubbles.filter(function(b){ return b.until > tick; });
  bubbles.forEach(function(b){
    var r = robots[b.id]; if (!r) return;
    var X = v.ox + r.x * v.s, Y = v.oy + (r.y - 28) * v.s, fs = Math.max(11, Math.round(3.8 * v.s));
    ctx.font = '600 ' + fs + 'px Onest, sans-serif';
    var tw = Math.min(ctx.measureText(b.text).width + 16 * dpr, cv.width * .6);
    ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#141414'; ctx.lineWidth = 1.5 * dpr;
    roundRect(X - tw / 2, Y - fs, tw, fs * 2, fs * .7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#141414'; ctx.fillText(b.text, X, Y + 1, tw - 10 * dpr);
  });
  requestAnimationFrame(frame);
}
// таблички отделов: иконка, название, число агентов (зелёная точка, если кто-то работает)
function drawSigns(v, dpr){
  var names = {}, counts = {}, busy = {};
  (S.depts || []).forEach(function(d){ names[d[0]] = d[1]; });
  names.lounge = 'Лаунж';
  S.agents.forEach(function(a){ var k = deptOf(a); counts[k] = (counts[k] || 0) + 1; if (a.status === 'working') busy[k] = true; });
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  var fs = Math.max(10, Math.round(3.3 * v.s));
  ZONES.forEach(function(z){
    var label = (DEPT_ICON[z.key] || '') + ' ' + (names[z.key] || z.key), n = counts[z.key] || 0;
    ctx.font = '800 ' + fs + 'px Onest, sans-serif';
    var tw = ctx.measureText(label).width, cw = n ? ctx.measureText(String(n)).width + fs * 1.1 : 0;
    var X = v.ox + (z.x + 4) * v.s, Y = v.oy + (z.y + 4) * v.s, w = tw + cw + fs * 1.4, h = fs * 1.8;
    ctx.fillStyle = 'rgba(20,20,20,.86)'; roundRect(X, Y, w, h, h / 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.fillText(label, X + fs * .6, Y + h / 2 + 1);
    if (n) {
      var cx = X + fs * .6 + tw + fs * .5;
      ctx.fillStyle = busy[z.key] ? '#2BB673' : '#FFBA09'; roundRect(cx, Y + h * .18, cw, h * .64, h * .32); ctx.fill();
      ctx.fillStyle = '#141414'; ctx.fillText(String(n), cx + fs * .55, Y + h / 2 + 1);
    }
  });
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
cv.addEventListener('click', function(ev){
  var b = cv.getBoundingClientRect(), dpr = cv.width / b.width, v = view();
  var x = ((ev.clientX - b.left) * dpr - v.ox) / v.s, y = ((ev.clientY - b.top) * dpr - v.oy) / v.s, best = null, bd = 14;
  Object.keys(robots).forEach(function(k){ var r = robots[k], d = Math.hypot(r.x - x, (r.y - 8) - y); if (d < bd) { bd = d; best = r.id; } });
  if (best) select(best);
});
window.addEventListener('resize', resize);

/* ================= панели ================= */
function deptName(a){ var k = deptOf(a), n = k === 'lounge' ? 'Без отдела' : k; (S.depts || []).forEach(function(d){ if (d[0] === k) n = d[1]; }); return n; }
function renderTeam(){
  var order = DEPT_ORDER.concat(['lounge']);
  $('team').innerHTML = S.agents.slice().sort(function(a, b){ return (order.indexOf(deptOf(a)) - order.indexOf(deptOf(b))) || (b.is_main - a.is_main) || (a.id - b.id); }).map(function(a){
    return '<div class="card' + (S.sel === a.id ? ' sel' : '') + (S.fresh && S.fresh[a.id] > Date.now() ? ' new' : '') + '" data-id="' + a.id + '"><span class="av" style="background:' + esc(a.color) + '">' + esc(initials(a.name)) + '</span><span><b>' + esc(a.name) + (a.is_main ? ' ★' : '') + '</b><small><span class="st ' + esc(a.status) + '"></span>' + (a.status === 'working' ? 'работает' : 'свободен') + ' · ' + esc(deptName(a)) + '</small></span></div>';
  }).join('');
}
$('team').addEventListener('click', function(e){ var c = e.target.closest('.card'); if (c) select(+c.dataset.id); });
function renderHead(){
  var a = agent(S.sel);
  $('ah').innerHTML = a ? '<span class="av" style="background:' + esc(a.color) + '">' + esc(initials(a.name)) + '</span><div><h2>' + esc(a.name) + (a.is_main ? ' ★' : '') + '</h2><p><span class="st ' + esc(a.status) + '"></span>' + esc(a.role || '') + '</p></div>' : '';
}
function select(id){ S.sel = id; S.msgsKey = ''; renderTeam(); renderHead(); renderPane(true); var r = robots[id]; if (r) say(id, 'Слушаю 👀', 120); }
document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ S.tab = t.dataset.tab; document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === t); }); S.msgsKey = ''; renderPane(true); }); });

function renderPane(force){
  var a = agent(S.sel); if (!a) return;
  $('composer').hidden = S.tab !== 'chat';
  if (S.tab === 'chat') return loadMsgs(force);
  if (S.tab === 'tasks') {
    var list = S.tasks.filter(function(t){ return t.agent_id === a.id; });
    var html = list.length ? list.map(taskHtml).join('') : '<p class="empty">Задач пока нет. Напиши в чате и нажми «Дать задачу».</p>';
    if ($('pane').dataset.k !== 't' + a.id + JSON.stringify(list.map(function(t){ return [t.id, t.status]; })) || force) { $('pane').innerHTML = '<div style="display:grid;gap:8px">' + html + '</div>'; $('pane').dataset.k = 't' + a.id + JSON.stringify(list.map(function(t){ return [t.id, t.status]; })); }
    return;
  }
  if (S.tab === 'edit' && (force || $('pane').dataset.k !== 'e' + a.id)) {
    $('pane').dataset.k = 'e' + a.id;
    $('pane').innerHTML = '<div class="form" style="padding:0"><label>Инструкция агента<textarea rows="10" readonly>' + esc(a.prompt) + '</textarea></label>' +
      '<div class="row"><button class="btn y" id="editA">✏️ Изменить</button>' + (a.is_main ? '' : '<button class="btn" id="fireA">Уволить</button>') + '</div></div>';
    $('editA').onclick = function(){ openHire(a); };
    if ($('fireA')) $('fireA').onclick = function(){ if (confirm('Уволить «' + a.name + '»? Переписка с ним удалится.')) api('/api/agents/' + a.id, null, 'DELETE').then(function(){ S.sel = null; poll(); }); };
  }
}
function taskHtml(t){
  var a = agent(t.agent_id), st = {queued:'в очереди', working:'в работе', done:'готово', error:'ошибка'}[t.status] || t.status;
  return '<details class="task"><summary><span class="s ' + esc(t.status) + '">' + st + '</span><span>' + (a ? '<b>' + esc(a.name) + ':</b> ' : '') + esc(t.title.slice(0, 140)) + '</span></summary>' + (t.result ? '<pre>' + md(t.result) + '</pre>' : '') + '</details>';
}
function loadMsgs(force){
  var id = S.sel; if (!id) return;
  api('/api/messages?agent_id=' + id).then(function(list){
    if (id !== S.sel || S.tab !== 'chat') return;
    var a = agent(id), key = id + ':' + list.length + ':' + (a && a.status);
    if (!force && key === S.msgsKey) return; S.msgsKey = key;
    var p = $('pane'), atBottom = p.scrollHeight - p.scrollTop - p.clientHeight < 80;
    p.dataset.k = 'c' + id;
    p.innerHTML = (list.length ? list.map(function(m){
      return '<div class="m ' + esc(m.role) + '">' + (m.role !== 'user' ? '<span class="au">' + esc(m.role === 'system' ? m.author : m.author) + '</span>' : '') + md(m.text) + '</div>';
    }).join('') : '<p class="empty">Напиши первое сообщение. ' + (a && a.is_main ? 'Оркестратор сам раздаст задачи команде.' : '') + '</p>') +
      (a && a.status === 'working' ? '<div class="typing">' + esc(a.name) + ' работает…</div>' : '');
    if (atBottom || force) p.scrollTop = p.scrollHeight;
  }).catch(function(){});
}
function send(asTask){
  var text = $('inp').value.trim(), a = agent(S.sel); if (!text || !a) return;
  $('inp').value = '';
  var p = asTask ? api('/api/tasks', {agent_id: a.id, title: text}) : api('/api/chat', {agent_id: a.id, text: text});
  say(a.id, asTask ? 'Взял задачу 💪' : '…', 120);
  p.then(function(){ S.msgsKey = ''; setTimeout(poll, 300); });
}
$('send').onclick = function(){ send(false); };
$('task').onclick = function(){ send(true); };
$('inp').addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(false); });
$('btnTasks').onclick = function(){ document.querySelector('.tab[data-tab="tasks"]').click(); };

/* ================= найм ================= */
var TPLS = [];
function openHire(a){
  S.editId = a ? a.id : null;
  $('hireTitle').textContent = a ? 'Настройки агента' : 'Нанять агента';
  $('hireSave').textContent = a ? 'Сохранить' : 'Нанять';
  $('fDept').innerHTML = '<option value="">Без отдела</option>' + (S.depts || []).map(function(d){ return '<option value="' + esc(d[0]) + '">' + esc(d[1]) + ' · ' + esc(d[2]) + '</option>'; }).join('');
  $('fDept').value = a ? (a.dept || '') : '';
  $('fName').value = a ? a.name : ''; $('fRole').value = a ? a.role : ''; $('fPrompt').value = a ? a.prompt : ''; $('fModel').value = a ? (a.model || '') : '';
  S.color = a ? a.color : COLORS[(S.agents.length) % COLORS.length]; paintColors(); $('hireErr').textContent = '';
  $('tpls').parentNode.hidden = !!a;
  $('hire').hidden = false; setTimeout(function(){ $('fName').focus(); }, 50);
}
function paintColors(){ $('fColors').innerHTML = COLORS.map(function(c){ return '<button type="button" data-c="' + c + '" class="' + (c === S.color ? 'on' : '') + '" style="background:' + c + '"></button>'; }).join(''); }
$('fColors').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) { S.color = b.dataset.c; paintColors(); } });
$('tpls').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; var t = TPLS[+b.dataset.i]; $('fName').value = t.name; $('fRole').value = t.role; $('fPrompt').value = t.prompt; $('fDept').value = t.dept || ''; S.color = t.color; paintColors(); });
$('btnHire').onclick = function(){ openHire(null); };
$('hireCancel').onclick = function(){ $('hire').hidden = true; };
$('hireSave').onclick = function(){
  var body = {id: S.editId, name: $('fName').value.trim(), role: $('fRole').value.trim(), prompt: $('fPrompt').value.trim(), color: S.color, model: $('fModel').value.trim(), dept: $('fDept').value};
  if (!body.name) { $('hireErr').textContent = 'Дай агенту имя'; return; }
  if (!body.prompt) { $('hireErr').textContent = 'Напиши инструкцию: кто он, с чем работает и что выдаёт'; return; }
  api('/api/agents', body).then(function(r){ if (!r.ok) { $('hireErr').textContent = r.error || 'Не получилось'; return; } $('hire').hidden = true; poll().then(function(){ select(r.id); }); });
};

/* ================= вход и опрос ================= */
$('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  api('/api/login', {password: $('pwd').value}).then(function(r){ if (r.ok) { $('login').hidden = true; start(); } else $('loginErr').textContent = 'Неверный пароль'; }).catch(function(){ $('loginErr').textContent = 'Неверный пароль'; });
});
var polling = false;
function poll(){
  return api('/api/state?since=' + S.last).then(function(d){
    var first = !S.polled; S.polled = true;
    S.agents = d.agents; S.tasks = d.tasks; S.depts = d.depts || S.depts;
    var nw = d.agents.filter(function(a){ return a.status === 'working'; }).length;
    $('stats').innerHTML = '<b class="g">●</b> ' + nw + ' в работе · ' + (d.agents.length - nw) + ' свободны · ' + (d.depts || []).length + ' отделов';
    if (!first) { syncRobots(); d.events.filter(function(e){ return e.ts > Date.now() / 1000 - 180; }).forEach(onEvent); }
    // при первом открытии проигрываем недавние события, чтобы было видно, как раздавались задачи
    S.last = first ? Math.max(0, d.last - 20) : d.last;
    $('brain').textContent = d.brain ? '🧠 ' + d.model.split('/').pop() : '🔌 нейросеть не подключена';
    $('brain').className = 'brain ' + (d.brain ? 'on' : 'off');
    syncRobots();
    if (!agent(S.sel) && S.agents.length) { S.sel = S.agents[0].id; }
    renderTeam(); renderHead(); renderPane(false);
  });
}
var started = false;
function start(){
  if (started) return; started = true;
  api('/api/templates').then(function(t){ TPLS = t; $('tpls').innerHTML = t.map(function(x, i){ return '<button type="button" data-i="' + i + '">' + esc(x.name) + '</button>'; }).join(''); });
  poll().then(function(){ renderPane(true); });
  setInterval(function(){ if (!document.hidden) poll().catch(function(){}); }, 1500);
}
resize(); requestAnimationFrame(frame);
api('/api/state').then(function(){ start(); }).catch(function(){});
})();
</script>
